name: Build sida-eltdx

on:
  # 监听上游 eltdx 新 release
  repository:
    types: [released]
  workflow_dispatch:
    inputs:
      eltdx_version:
        description: 'eltdx version (e.g. 3.0.7)'
        required: false
        default: '3.0.7'

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      DOCKERHUB_USERNAME: shit6
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      ELTDX_VERSION: ${{ github.event.inputs.eltdx_version || '3.0.7' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            shit6/sida-eltdx:latest
            shit6/sida-eltdx:v${{ env.ELTDX_VERSION }}
          build-args: |
            ELTDX_VERSION=${{ env.ELTDX_VERSION }}
